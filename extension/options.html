<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>寻词 · AI 设置</title><style>body{font:15px/1.8 system-ui;background:#f5f5ef;color:#303929;max-width:600px;margin:60px auto;padding:24px}label{display:block;margin:20px 0}input{box-sizing:border-box;display:block;width:100%;padding:12px;border:1px solid #ccd4c0;border-radius:8px;font:inherit}button{padding:11px 20px;border:0;border-radius:8px;background:#71865a;color:white;cursor:pointer;margin-right:10px}p{color:#747d6b}#status{white-space:pre-wrap}</style></head><body><h1>✳ 寻词 · AI 设置</h1><p>配置后，在 Pinterest 搜索框旁点击「寻词」，即可生成符合绘画语境的英文建议。留空则使用有限的本地词库。</p><form id="settings"><label>Chat Completions 完整 HTTPS 接口地址<input id="endpoint" type="url" placeholder="https://你的服务域名/v1/chat/completions"></label><label>模型名称<input id="model" placeholder="填写服务商提供的模型名称" maxlength="150"></label><label>API 密钥<input id="apiKey" type="password" autocomplete="off" placeholder="仅保存在这台浏览器，不会同步"></label><button type="submit">保存并授权此域名</button><button id="clear" type="button">清除 AI 配置</button></form><p id="status" role="status"></p><p>使用 AI 时，你输入的描述与所选方向会发送给你配置的服务商，可能产生 API 费用。插件不发送 Pinterest 页面、账号或图片内容。密钥保存在扩展本地存储中，不会交给 Pinterest 页面；本地存储并非加密保险库，请使用限额密钥。不要在聊天中发送密钥。</p><script src="options.js"></script></body></html>
